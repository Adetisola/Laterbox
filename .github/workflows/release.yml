name: Laterbox Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Robolectric SDKs
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository/org/robolectric/android-all
            ~/.cache/robolectric
          key: robolectric-${{ runner.os }}-sdk34
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --info --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Setup Signing Keystore & Version Metadata
        id: setup_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required release signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Refusing to fall back to debug signing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          echo "KEYSTORE_PATH=/tmp/release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV

          RAW_TAG="${{ github.event.inputs.version_tag || github.ref_name }}"
          CLEAN_VERSION="${RAW_TAG#v}"
          if [ -z "$CLEAN_VERSION" ] || [ "$CLEAN_VERSION" = "main" ]; then
            CLEAN_VERSION="1.0.0"
          fi
          COMPUTED_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$COMPUTED_VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$CLEAN_VERSION" >> $GITHUB_ENV
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> $GITHUB_ENV
          fi
          echo "Configured release build: versionName=$CLEAN_VERSION, versionCode=$COMPUTED_VERSION_CODE"

      - name: Build Release APKs
        run: ./gradlew assembleRelease

      - name: Locate, Verify & Package Release APKs
        id: locate_apks
        run: |
          mkdir -p release_artifacts
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name "aapt2" | sort -V | tail -n 1)
          EXPECTED_SHA256="67388d12f96d7b15179ef02354842faabfaff944a49c466ad3f539d2a2063e32"

          ARM32_SRC=$(find app/build/outputs/apk/release/ -name "*armeabi-v7a*.apk" | head -n 1)
          ARM64_SRC=$(find app/build/outputs/apk/release/ -name "*arm64-v8a*.apk" | head -n 1)
          UNIVERSAL_SRC=$(find app/build/outputs/apk/release/ -name "*universal*.apk" | head -n 1)
          if [ -z "$UNIVERSAL_SRC" ]; then
            UNIVERSAL_SRC="app/build/outputs/apk/release/app-release.apk"
          fi

          if [ ! -f "$ARM32_SRC" ] || [ ! -f "$ARM64_SRC" ] || [ ! -f "$UNIVERSAL_SRC" ]; then
            echo "::error::Could not find all 3 required release APKs in app/build/outputs/apk/release/!"
            echo "ARM32: $ARM32_SRC"
            echo "ARM64: $ARM64_SRC"
            echo "Universal: $UNIVERSAL_SRC"
            ls -la app/build/outputs/apk/release/
            exit 1
          fi

          cp "$ARM32_SRC" release_artifacts/Laterbox-ARM32.apk
          cp "$ARM64_SRC" release_artifacts/Laterbox-ARM64.apk
          cp "$UNIVERSAL_SRC" release_artifacts/Laterbox-Universal.apk

          echo "=== Verifying APKs ==="
          for TARGET in release_artifacts/Laterbox-ARM32.apk release_artifacts/Laterbox-ARM64.apk release_artifacts/Laterbox-Universal.apk; do
            echo "--- Verifying $TARGET ---"
            BADGING=$("$AAPT2" dump badging "$TARGET")
            PKG_LINE=$(echo "$BADGING" | grep "^package:")
            echo "$PKG_LINE"

            APK_PKG=$(echo "$PKG_LINE" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            APK_VCODE=$(echo "$PKG_LINE" | sed -n "s/.* versionCode='\([^']*\)'.*/\1/p")
            APK_VNAME=$(echo "$PKG_LINE" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")

            if [ "$APK_PKG" != "com.laterbox.app" ]; then
              echo "::error::Unexpected applicationId in $TARGET: $APK_PKG"
              exit 1
            fi
            if [ "$APK_VCODE" != "$VERSION_CODE" ] || [ "$APK_VCODE" -le 1 ]; then
              echo "::error::Invalid versionCode in $TARGET: $APK_VCODE (expected $VERSION_CODE)"
              exit 1
            fi
            if [ "$APK_VNAME" != "$VERSION_NAME" ]; then
              echo "::error::Unexpected versionName in $TARGET: $APK_VNAME (expected $VERSION_NAME)"
              exit 1
            fi

            CERT_OUT=$("$APKSIGNER" verify --verbose --print-certs "$TARGET")
            if echo "$CERT_OUT" | grep -qi "Android Debug"; then
              echo "::error::$TARGET is signed with an Android Debug certificate!"
              exit 1
            fi
            ACTUAL_SHA256=$(echo "$CERT_OUT" | grep -i "certificate SHA-256 digest:" | awk '{print $NF}' | tr '[:upper:]' '[:lower:]' | tr -d ':')
            if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
              echo "::error::Certificate SHA-256 mismatch in $TARGET! Got $ACTUAL_SHA256, expected $EXPECTED_SHA256"
              exit 1
            fi
            ls -lh "$TARGET"
          done

          echo "=== Verifying Architecture Contents ==="
          # ARM32 must contain armeabi-v7a and must NOT contain arm64-v8a
          if ! unzip -l release_artifacts/Laterbox-ARM32.apk | grep -q "lib/armeabi-v7a/libpython.zip.so"; then
            echo "::error::Laterbox-ARM32.apk missing lib/armeabi-v7a/libpython.zip.so!"
            exit 1
          fi
          if unzip -l release_artifacts/Laterbox-ARM32.apk | grep -q "lib/arm64-v8a/"; then
            echo "::error::Laterbox-ARM32.apk unexpectedly contains arm64-v8a native libraries!"
            exit 1
          fi

          # ARM64 must contain arm64-v8a and must NOT contain armeabi-v7a
          if ! unzip -l release_artifacts/Laterbox-ARM64.apk | grep -q "lib/arm64-v8a/libpython.zip.so"; then
            echo "::error::Laterbox-ARM64.apk missing lib/arm64-v8a/libpython.zip.so!"
            exit 1
          fi
          if unzip -l release_artifacts/Laterbox-ARM64.apk | grep -q "lib/armeabi-v7a/"; then
            echo "::error::Laterbox-ARM64.apk unexpectedly contains armeabi-v7a native libraries!"
            exit 1
          fi

          # Universal must contain both architectures
          if ! unzip -l release_artifacts/Laterbox-Universal.apk | grep -q "lib/armeabi-v7a/libpython.zip.so" || \
             ! unzip -l release_artifacts/Laterbox-Universal.apk | grep -q "lib/arm64-v8a/libpython.zip.so"; then
            echo "::error::Laterbox-Universal.apk missing required dual-architecture native libraries!"
            exit 1
          fi

          echo "All 3 APKs verified successfully!"

      - name: Upload Release APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: laterbox-release-apks
          path: release_artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.version_tag || github.ref_name }}
          name: Laterbox ${{ github.event.inputs.version_tag || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release_artifacts/Laterbox-ARM32.apk
            release_artifacts/Laterbox-ARM64.apk
            release_artifacts/Laterbox-Universal.apk
          generate_release_notes: true


